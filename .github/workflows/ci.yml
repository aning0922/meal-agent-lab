# 阶段 09A / M5：远端 CI 与本地共用同一个入口 `pnpm stage09a:check`，不维护
# 第二套部署逻辑。该命令内部先跑完整的 `pnpm stage08:check`（需要原生
# PostgreSQL 18），再跑全部容器化门禁与演练（需要 Docker Engine + Compose v2，
# ubuntu-latest 自带）。
#
# 纪律（计划文档 M5 第 3 项）：在本 workflow 产生**真实成功 run** 之前，文档只能
# 记录「workflow 已配置」，不得记录 CI Pass；真实 run 通过后必须登记 URL/ID
# （验收门禁 #10）。
name: ci

permissions:
  contents: read

concurrency:
  group: stage09a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  stage09a-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0; exact Docker 29.6.2 + containerd image store
        with:
          version: v29.6.2
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Verify exact Docker evidence capabilities
        run: |
          if [ "$(docker version --format '{{.Server.Version}}')" != 29.6.2 ]; then
            echo "CI Docker server version drifted" >&2
            exit 1
          fi
          if [ "$(docker info --format '{{json .DriverStatus}}')" != '[["driver-type","io.containerd.snapshotter.v1"]]' ]; then
            echo "CI Docker image store capability drifted" >&2
            exit 1
          fi
          docker compose version

      - name: Install exact PostgreSQL 18.4 toolchain (PGDG)
        run: |
          if [ "$(dpkg --print-architecture)" != amd64 ]; then
            echo "CI PostgreSQL package architecture is unsupported" >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update

          pg_deb_dir="${RUNNER_TEMP}/postgresql-18.4"
          install -d -m 0700 "$pg_deb_dir"
          pg_client_deb="$pg_deb_dir/postgresql-client-18.deb"
          pg_server_deb="$pg_deb_dir/postgresql-18.deb"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            'https://apt.postgresql.org/pub/repos/apt/pool/main/p/postgresql-18/postgresql-client-18_18.4-1.pgdg24.04%2B1_amd64.deb' \
            --output "$pg_client_deb"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            'https://apt.postgresql.org/pub/repos/apt/pool/main/p/postgresql-18/postgresql-18_18.4-1.pgdg24.04%2B1_amd64.deb' \
            --output "$pg_server_deb"
          printf '%s  %s\n%s  %s\n' \
            'ff3fb9af478e4bdada47168681d9987917fd3170b043c612d6d01f0c923469c2' "$pg_client_deb" \
            '13f382b7c876ffafd98a43431007697827197da78a86dd01b4e5a3da5e3de5eb' "$pg_server_deb" \
            | sha256sum --check --strict
          sudo apt-get install -y "$pg_client_deb" "$pg_server_deb"

          for tool in createdb initdb pg_ctl postgres psql; do
            "$PG_BIN/$tool" --version
          done

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage 09A full gate (same single entry point as local)
        run: pnpm stage09a:check
