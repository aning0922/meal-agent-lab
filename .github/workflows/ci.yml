# 阶段 09A / M5：远端 CI 与本地共用同一个入口 `pnpm stage09a:check`，不维护
# 第二套部署逻辑。该命令内部先跑完整的 `pnpm stage08:check`（需要原生
# PostgreSQL 18），再跑全部容器化门禁与演练（需要 Docker Engine + Compose v2，
# ubuntu-latest 自带）。
#
# 纪律（计划文档 M5 第 3 项）：在本 workflow 产生**真实成功 run** 之前，文档只能
# 记录「workflow 已配置」，不得记录 CI Pass；真实 run 通过后必须登记 URL/ID
# （验收门禁 #10）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  stage09a-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 18 (PGDG)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18
          "$PG_BIN/postgres" --version

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage 09A full gate (same single entry point as local)
        run: pnpm stage09a:check
