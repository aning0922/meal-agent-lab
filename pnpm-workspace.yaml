packages:
  - apps/client
  - packages/contracts
  - packages/domain
  - services/api

# 阶段 09A / M5：显式关闭 pnpm 的 verify-deps-before-run 隐式安装层。
# 实测（2026-08-11，pnpm 11.9.0）：`pnpm --filter @meal-agent/api deploy --prod
# --legacy <dir>`（镜像门禁与 Dockerfile runtime-closure 都用它）会改写工作区的
# deps 状态记录，下一条 `pnpm run`/`pnpm exec` 的自动校验因此试图执行
# `pnpm install --production`——那会清掉整个 dev 依赖树，非 TTY 下则直接中止。
# 门禁仓库不允许任何隐式 install：本地与 CI 都只用显式的
# `pnpm install --frozen-lockfile`。
verifyDepsBeforeRun: false

overrides:
  miniprogram-simulate@1.6.2>postcss: 8.5.23
  fast-uri@3.1.4: 3.1.5
  fast-uri@4.1.1: 4.1.2
  brace-expansion@1.1.16: 1.1.18
  brace-expansion@2.1.2: 2.1.4
  brace-expansion@5.0.8: 5.0.9
  # GHSA-2v37-7h3g-55p8（high，2026-08-13 上游修订）：3.x 的最终修复版为
  # 3.3.18；此前 3.3.17 仍受 size=0 无限循环影响。按既有策略直接 patch，
  # 不把新公告扩进 local-weapp 临时例外。
  nanoid@3.3.16: 3.3.18
  nanoid@3.3.17: 3.3.18

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  core-js: true
  core-js-pure: true
  esbuild: true
